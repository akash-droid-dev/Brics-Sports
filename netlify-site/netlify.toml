# Netlify copy of the Live Hub. Deploy this folder on its own:
#   CLI: run `npx netlify-cli deploy --build --prod` inside netlify-site/
#   Git: set the project's Base directory to `netlify-site`
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every page URL loads index.html (the API is routed by the function's config).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
